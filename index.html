<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYWORTH Solar - Make Every Ray of Sunshine Count</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Gilroy font-face declarations */
        @font-face {
            font-family: 'Gilroy';
            src: url('assets/fonts/Gilroy字体/Gilroy-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Gilroy';
            src: url('assets/fonts/Gilroy字体/Gilroy-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Gilroy';
            src: url('assets/fonts/Gilroy字体/Gilroy-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'Gilroy';
            src: url('assets/fonts/Gilroy字体/Gilroy-ExtraBoldItalic.ttf') format('truetype');
            font-weight: 800;
            font-style: italic;
        }
        @font-face {
            font-family: 'Gilroy';
            src: url('assets/fonts/Gilroy字体/Gilroy-Heavy.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }

        body {
            font-family: 'Gilroy', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* Full screen background */
        .page-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
        }

        .page-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 20, 40, 0.88) 0%, rgba(0, 40, 60, 0.75) 50%, rgba(0, 20, 50, 0.85) 100%);
            z-index: 1;
        }

        .page-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 36px 60px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        /* Main body - centered */
        .body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-page {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 60px 20px;
        }

        .error-container {
            text-align: center;
            max-width: 500px;
        }

        .error-visual {
            margin-bottom: 32px;
        }

        .error-visual svg {
            max-width: 300px;
            height: auto;
        }

        .error-container .error-code {
            font-size: 40px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            text-shadow: 0 0 80px rgba(0, 198, 255, 0.4);
        }

        .error-container h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: rgba(255,255,255,0.95);
        }

        .error-container p {
            font-size: 15px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 32px;
        }

        .error-links {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .error-links .btn-primary {
            padding: 14px 32px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .error-links .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 198, 255, 0.35);
        }

        .error-links .btn-secondary {
            padding: 14px 32px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s;
        }

        .error-links .btn-secondary:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(0, 198, 255, 0.3);
        }

        .error-contact {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
        }

        .error-contact a {
            color: #00c6ff;
            text-decoration: none;
        }

        .error-contact a:hover {
            text-decoration: underline;
        }

        .performance-card {
            background: linear-gradient(135deg, rgba(0, 114, 255, 0.15), rgba(0, 198, 255, 0.1));
            border: 1px solid rgba(0, 198, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .performance-card .perf-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
        }

        .performance-card .perf-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        .performance-card .perf-item {
            margin-bottom: 24px;
        }

        .performance-card .perf-item:last-child {
            margin-bottom: 0;
        }

        .performance-card .perf-item .label {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }

        .performance-card .perf-item .value {
            font-size: 28px;
            font-weight: 700;
            color: #00c6ff;
        }

        .performance-card .perf-item .value small {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.6);
        }

        /* Company Info */
        .company-info {
            text-align: center;
            padding: 24px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: auto;
        }

        .company-info h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .company-info p {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            line-height: 1.6;
        }

        /* Glow accent */
        .glow-accent {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,114,255,0.12) 0%, transparent 70%);
            top: 10%;
            right: 15%;
            z-index: 2;
            pointer-events: none;
        }

        /* Footer */
        .footer {
            flex-shrink: 0;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .footer-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .footer-bottom .footer-nav {
            display: flex;
            align-items: center;
            gap: 48px;
        }

        .footer-bottom .footer-nav a {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-bottom .footer-nav a:hover {
            color: #00c6ff;
        }

        .footer-bottom .footer-nav img {
            height: 40px;
            width: auto;
        }

        .footer-bottom .footer-nav .brand-link span {
            color: #00c6ff;
            margin-left: 4px;
        }

        .footer-col h4 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 16px;
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col ul li {
            margin-bottom: 10px;
        }

        .footer-col ul li a {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-col ul li a:hover {
            color: #00c6ff;
        }

        .footer-col .related-link {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-col .related-link img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* Investor links */
        .footer-col.investors ul li a {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
        }

        /* Social icons */
        .social-icons {
            display: flex;
            gap: 16px;
        }

        .social-icons a {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .social-icons a:hover {
            background: rgba(0,198,255,0.2);
            transform: translateY(-2px);
        }

        .social-icons a svg {
            width: 18px;
            height: 18px;
            fill: rgba(255,255,255,0.7);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, rgba(0, 20, 40, 0.95), rgba(0, 40, 60, 0.9));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            backdrop-filter: blur(20px);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.2);
        }

        .modal-regions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .modal-section-title {
            grid-column: 1 / -1;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.4);
            margin-top: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .modal-section-title:first-child {
            margin-top: 0;
        }

        .modal-region-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s;
        }

        .modal-region-item:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(0,198,255,0.3);
        }

        .modal-region-item img {
            width: 24px;
            height: 18px;
            object-fit: contain;
        }

        .modal-region-item span {
            font-size: 13px;
        }

        /* Copyright */
        .footer-bottom {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-bottom .copyright {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            line-height: 1.5;
            text-align: center;
        }

        .footer-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .footer-bottom .footer-nav {
            display: flex;
            align-items: center;
            gap: 48px;
        }

        .footer-bottom .footer-nav a {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-bottom .footer-nav a:hover {
            color: #00c6ff;
        }

        .footer-bottom .footer-nav img {
            height: 40px;
            width: auto;
        }

        .footer-bottom .footer-nav .brand-link span {
            color: #00c6ff;
            margin-left: 4px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content {
                padding: 24px 32px;
            }

            .footer {
                grid-template-columns: 1fr 1fr;
                gap: 32px;
            }

            body {
                height: auto;
                overflow: auto;
            }

            .page-wrapper {
                height: auto;
                min-height: 100vh;
            }
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }

            .brand-section h1 {
                font-size: 32px;
            }

            .brand-selector {
                flex-direction: column;
                gap: 16px;
            }

            .footer {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .modal-regions {
                grid-template-columns: 1fr 1fr;
            }

            .footer-bottom {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="glow-accent"></div>

        <div class="content">
            <!-- Header -->
            <header class="header">
                <img src="assets/images/SkyworthLogo_Blue.png" alt="SKYWORTH Solar" class="logo">
            </header>

            <!-- Body -->
            <main class="body">
                <div class="error-page">
                    <div class="error-container">
                        <div class="error-visual">
                            <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                                <!-- Solar panel illustration -->
                                <rect x="50" y="100" width="300" height="150" rx="8" fill="none" stroke="rgba(0,198,255,0.3)" stroke-width="2"/>
                                <line x1="50" y1="150" x2="350" y2="150" stroke="rgba(0,198,255,0.2)" stroke-width="1"/>
                                <line x1="50" y1="200" x2="350" y2="200" stroke="rgba(0,198,255,0.2)" stroke-width="1"/>
                                <line x1="150" y1="100" x2="150" y2="250" stroke="rgba(0,198,255,0.2)" stroke-width="1"/>
                                <line x1="250" y1="100" x2="250" y2="250" stroke="rgba(0,198,255,0.2)" stroke-width="1"/>
                                <!-- Sun rays -->
                                <circle cx="320" cy="60" r="40" fill="none" stroke="#00c6ff" stroke-width="2" opacity="0.5"/>
                                <line x1="320" y1="10" x2="320" y2="0" stroke="#00c6ff" stroke-width="2" opacity="0.3"/>
                                <line x1="360" y1="30" x2="370" y2="20" stroke="#00c6ff" stroke-width="2" opacity="0.3"/>
                                <line x1="370" y1="60" x2="380" y2="60" stroke="#00c6ff" stroke-width="2" opacity="0.3"/>
                                <line x1="360" y1="90" x2="370" y2="100" stroke="#00c6ff" stroke-width="2" opacity="0.3"/>
                                <line x1="280" y1="30" x2="270" y2="20" stroke="#00c6ff" stroke-width="2" opacity="0.3"/>
                                <line x1="270" y1="60" x2="260" y2="60" stroke="#00c6ff" stroke-width="2" opacity="0.3"/>
                                <line x1="280" y1="90" x2="270" y2="100" stroke="#00c6ff" stroke-width="2" opacity="0.3"/>
                            </svg>
                        </div>
                        <div class="error-code">OUR NEW WEBSITE IS COMING SOON...</div>

                        <p>The page you're looking for is currently under construction.</p>
                        <div class="error-links">
                            <a href="#" onclick="openModal('both'); return false;" class="btn-secondary">Browse Global Sites</a>
                        </div>
                        <div class="error-contact">
                            <p>Need help? Contact us at</p>
                            <a href="tel:95105555">95105555</a>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Footer -->
            <footer class="footer">
                <div class="footer-bottom">
                    <span class="copyright">© 2026 SKYWORTH SOLAR CO., LTD.<br>深圳創維光伏科技股份有限公司</span>
                    <div class="footer-nav">
                        <a href="https://skyworth-pv.com"><img src="assets/images/logo.png" alt="SKYWORTH"></a>
                        <a href="#" class="brand-link" onclick="openModal('skyworth'); return false;">Global Sites <span>+</span></a>
                        <a href="#" class="brand-link" onclick="openModal('solavita'); return false;">Solavita Europe <span>+</span></a>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">Select Region</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-regions" id="modalRegions"></div>
        </div>
    </div>

    <script>
        const skyworthRegions = [
            { name: 'Global', lang: 'English', flag: 'globe2.svg', url: 'https://www.skyworth-pv.com/' },
            { name: 'Malaysia', lang: 'English', flag: 'my.svg', url: 'https://my.skyworth-pv.com/' },
            { name: 'Thailand', lang: 'ภาษาไทย', flag: 'th.svg', url: 'https://th.skyworth-pv.com/' },
            { name: 'Brasil', lang: 'Português', flag: 'globe1.svg', url: 'https://br.skyworth-pv.com/' },
            { name: 'Việt Nam', lang: 'Tiếng Việt', flag: 'vn.png', url: 'https://vn.skyworth-pv.com/' },
        ];

        const solavitaRegions = [
            { name: 'Europe', lang: 'English', flag: 'globe1.svg', url: 'https://www.solavita.com/' },
            { name: 'Italia', lang: 'Italiano', flag: 'it.svg', url: 'https://it.solavita.com/' },
            { name: 'Deutschland', lang: 'Deutsch', flag: 'de.svg', url: 'https://de.solavita.com/' },
        ];

        function openModal(brand) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const regions = document.getElementById('modalRegions');

            if (brand === 'skyworth') {
                title.textContent = 'SKYWORTH Solar — Global';
                regions.innerHTML = skyworthRegions.map(r => `
                    <a href="${r.url}" class="modal-region-item">
                        <img src="assets/images/${r.flag}" alt="">
                        <span>${r.name}</span>
                    </a>
                `).join('');
            } else if (brand === 'solavita') {
                title.textContent = 'Solavita — Europe';
                regions.innerHTML = solavitaRegions.map(r => `
                    <a href="${r.url}" class="modal-region-item">
                        <img src="assets/images/${r.flag}" alt="">
                        <span>${r.name}</span>
                    </a>
                `).join('');
            } else {
                title.textContent = 'Global Sites';
                regions.innerHTML = `
                    <div class="modal-section-title">SKYWORTH Solar</div>
                    ${skyworthRegions.map(r => `
                        <a href="${r.url}" class="modal-region-item">
                            <img src="assets/images/${r.flag}" alt="">
                            <span>${r.name}</span>
                        </a>
                    `).join('')}
                    <div class="modal-section-title">Solavita</div>
                    ${solavitaRegions.map(r => `
                        <a href="${r.url}" class="modal-region-item">
                            <img src="assets/images/${r.flag}" alt="">
                            <span>${r.name}</span>
                        </a>
                    `).join('')}
                `;
            }

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('modalOverlay')) return;
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
